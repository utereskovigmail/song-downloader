<!doctype html>
<html lang="uk"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Add Genre</title>
</head>
<body>

<div layout:fragment="content">

    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">
            Додати жанр
        </h1>

        <form th:action="@{/genres}" th:object="${genre}" method="post" class="space-y-6">

            <!-- Genre Name -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">
                    Назва жанру
                </label>
                <input type="text"
                       th:field="*{name}"
                       placeholder="Наприклад: Rock"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"/>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">
                    Опис
                </label>
                <textarea th:field="*{description}"
                          rows="4"
                          placeholder="Короткий опис жанру..."
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex justify-between items-center">
                <a href="/"
                   class="text-gray-600 hover:text-gray-900 transition">
                    ← Назад
                </a>

                <button type="submit"
                        class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg shadow-md transition">
                    Зберегти
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>

<!doctype html>
<html lang="uk"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Songs</title>
</head>
<body>
<div layout:fragment="content">

    <h1 class="text-3xl font-bold mb-4 text-gray-900">
        All available songs
    </h1>
<!--    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGpwdDUwbmJhaGllcGI2NXVvM2dtMHpibDhxbjVhcmM2enV0cnV4YSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3nbxypT20Ulmo/giphy.gif"-->
<!--         alt="Милий котик"-->
<!--         class="mx-auto rounded-lg shadow-lg max-w-sm">-->

    <div class="w-4/5 mx-auto flex justify-center flex-wrap gap-4">

        <div th:each="song : ${songs}"
             class="flex flex-col rounded-lg bg-white w-[28%] text-black shadow-lg">

            <!-- Image -->
            <a href="#!">
                <img class="rounded-t-lg w-full h-48 object-cover"
                     th:src="${song.image}"
                     alt="song image"/>
            </a>

            <!-- Content -->
            <div class="p-6">

                <!-- Song name -->
                <h5 class="mb-2 text-xl font-medium"
                    th:text="${song.name}">
                </h5>

                <!-- Artist -->
                <p class="mb-2 text-gray-600"
                   th:text="${song.artist}">
                </p>

                <!-- Album -->
                <p class="mb-4 text-sm text-gray-500"
                   th:text="${song.album}">
                </p>

<!--                &lt;!&ndash; Audio link &ndash;&gt;-->
<!--                <audio th:id="'audio-' + ${song.id}">-->

<!--                    <source th:src="@{'/music/' + ${song.audio}}" type="audio/mpeg">-->

<!--                    Your browser does not support audio.-->

<!--                </audio>-->

<!--                &lt;!&ndash; Play button &ndash;&gt;-->

<!--                <button type="button"-->

<!--                        class="bg-green-500 text-white px-4 py-2 rounded-lg"-->

<!--                        th:onclick="'playSong(' + ${song.id} + ')'">-->

<!--                    ▶ Play-->

<!--                </button>-->

                <div class="flex items-center gap-2 mt-3">

                    <button type="button"

                            class="bg-green-500 text-white px-3 py-1 rounded-full text-sm"

                            th:onclick="'playSong(' + ${song.id} + ')'">

                        ▶ Play

                    </button>

                    <audio th:id="'audio-' + ${song.id}" class="audio-player">

                        <source th:src="@{'/music/' + ${song.audio}}" type="audio/mpeg">

                    </audio>

                </div>

            </div>
        </div>

    </div>
    <script>
        window.playSong = function(id) {
            const audio = document.getElementById('audio-' + id);

            if (!audio) {
                console.error("Audio not found:", id);
                return;
            }

            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        };

        const players = document.querySelectorAll('.audio-player');

        players.forEach(player => {
            player.addEventListener('play', () => {
                players.forEach(other => {
                    if (other !== player) {
                        other.pause();
                        other.currentTime = 0;
                    }
                });
            });
        });
    </script>
</div>

</body>
</html>
